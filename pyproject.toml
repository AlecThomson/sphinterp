[project]
name = "sphinterp"
version = "1.0.0"
description = "Catalogue interpolation on the sphere with HEALPix"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "astropy>=6",
    "healpy>=1",
    "numpy>=2",
    "pandas>=2",
    "polars>=1.3",
    "scipy>=1.15.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 88
indent-width = 4

# Assume Python 3.10
target-version = "py310"

[tool.ruff.lint]
select = ["ALL"]  # See the Default Rules page for the full listing.
ignore = [
    "D203",    # keep D211 (no blank line before class docstring)
    "D213",    # keep D212 (summary on first line)
    "COM812",  # conflicts with the formatter (trailing commas)
    "E501",
    "W505",
    "PLR0913"
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

[dependency-groups]
dev = [
    "ruff>=0.16.10",
    "ty>=0.0.85",
]
examples = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.10.9",
]

[[tool.ty.overrides]]
include = ["sphinterp.py", "example/**"]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"
